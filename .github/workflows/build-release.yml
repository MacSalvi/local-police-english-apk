name: Build & Publish APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Compilar APK Debug
        run: |
          gradle assembleDebug \
            -Dksp.incremental=false \
            -Dksp.incremental.intermodule=false \
            -Dkotlin.compiler.execution.strategy="in-process" \
            --no-daemon

      - name: Publicar Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: "Local Police English v1.0.0"
          body: |
            Instalador oficial offline de la aplicación.
            Descargue el archivo `app-debug.apk` e instálelo en el terminal Android.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
