name: Android Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
  release:
    types: [published, created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1

      - name: Update version code and name
        run: |
          sed -i 's/versionCode = 1/versionCode = ${{ github.run_number }}/g' app/build.gradle.kts
          sed -i 's/versionName = "1.0"/versionName = "1.0.${{ github.run_number }}"/g' app/build.gradle.kts

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-v1.0.${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/build/outputs/apk/debug/app-debug.apk"
          tag: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: "Inglés Operativo Policial ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}"
          body: "APK de la aplicación compilada para Android (Compilación #${{ github.run_number }})."
          allowUpdates: true
          recreateRelease: false
          token: ${{ secrets.GITHUB_TOKEN }}


